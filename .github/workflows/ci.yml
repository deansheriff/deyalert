name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dey_alert
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dey_alert"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dey_alert
      ALLOW_UNAUTHENTICATED_DEV: "true"
      USE_IN_MEMORY_STORE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e backend
      - run: python backend/scripts/run_migrations.py
      - run: python -m pytest backend/tests
      - run: sh -n backend/scripts/*.sh deploy/scripts/*.sh

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
